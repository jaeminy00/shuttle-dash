<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuttle Panel</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* The panel is authored at exactly 1080 x 1920 (the wall screen) and
     scaled to fit whatever viewport it lands in, so every number below is
     a literal design pixel. */
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #0c0d0c; -webkit-font-smoothing: antialiased; }

  /* centred on the viewport; fit() supplies the scale (and rotation, if the
     screen is landscape) as a single transform about the stage's middle */
  #stage {
    position: absolute; top: 50%; left: 50%;
    width: 1080px; height: 1920px;
    transform-origin: 50% 50%;
  }

  .panel { width: 1080px; height: 1920px; box-sizing: border-box;
           font-family: 'Barlow Condensed', system-ui, sans-serif; }
  .mono  { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
  [hidden] { display: none !important; }

  /* ---------------------------------------------------------- day state */

  #day {
    background: #0c0d0c; color: #f4f1ea;
    display: flex; flex-direction: column;
    padding: 48px 52px 40px;
  }

  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .clock { font-family: 'IBM Plex Mono', monospace; font-weight: 400;
           font-size: 158px; line-height: 1; letter-spacing: -5px; }
  .dateline { font-size: 40px; font-weight: 600; letter-spacing: 6px;
              text-transform: uppercase; color: #8d8a80; margin-top: 6px;
              white-space: nowrap; }

  .wx { flex: none; min-width: 360px; text-align: right; display: flex;
        flex-direction: column; gap: 8px; padding-top: 6px; white-space: nowrap; }
  .wx-temps { display: flex; justify-content: flex-end; align-items: baseline; gap: 16px; }
  .wx-f, .wx-c { font-family: 'IBM Plex Mono', monospace; font-size: 80px;
                 font-weight: 500; line-height: 1; }
  .wx-f { color: #f5ece0; }
  .wx-c { color: #e4f0ea; }
  .wx-slash { font-size: 52px; font-weight: 400; line-height: 1; color: #5f5d57; }
  .wx-cond { font-size: 38px; font-weight: 600; letter-spacing: 3px;
             text-transform: uppercase; color: #8d8a80; }
  .wx-hilo { font-size: 34px; font-weight: 500; letter-spacing: 4px; color: #5f5d57; }

  .rule { height: 5px; background: #f0b429; margin-top: 30px; }
  .colhead { display: flex; justify-content: space-between; padding: 20px 0 22px; }
  .colhead span { font-size: 34px; font-weight: 600; letter-spacing: 9px;
                  text-transform: uppercase; color: #8d8a80; white-space: nowrap; }

  /* ------- departure groups (one block per travel goal) */

  .groups { display: flex; flex-direction: column; gap: 34px; }
  .group { background: var(--tint); border-left: 8px solid var(--accent); }

  .group-head { display: grid; grid-template-columns: 1fr 300px;
                align-items: end; gap: 20px; padding: 34px 30px 26px; }
  .group-title { font-size: 88px; font-weight: 700; letter-spacing: 1px;
                 line-height: 1; text-transform: uppercase; }
  .group-via { font-size: 34px; font-weight: 600; letter-spacing: 3px;
               text-transform: uppercase; color: #8d8a80; margin-top: 10px; }
  .group-leave { text-align: right; white-space: nowrap; }
  .group-leave-label { font-size: 28px; font-weight: 600; letter-spacing: 5px;
                       text-transform: uppercase; color: #8d8a80; }
  .group-leave-num { font-family: 'IBM Plex Mono', monospace; font-size: 146px;
                     font-weight: 500; line-height: 1; color: var(--accent); }
  .group-leave-num.none { color: #5f5d57; }
  .group-leave-unit { font-size: 36px; font-weight: 600; color: #8d8a80;
                      margin-left: 8px; }

  .route-row { display: grid; grid-template-columns: 190px 1fr; align-items: center;
               gap: 20px; padding: 24px 30px; border-top: 1px solid var(--line); }
  .route-label { font-family: 'IBM Plex Mono', monospace; font-size: 42px;
                 font-weight: 600; color: var(--accent); }
  .route-times { font-family: 'IBM Plex Mono', monospace; font-size: 48px;
                 font-weight: 400; color: #d8d4cb; letter-spacing: 1px;
                 white-space: nowrap; overflow: hidden; }
  .route-times.empty { color: #5f5d57; font-size: 36px; text-overflow: ellipsis; }
  /* a departure you can no longer walk to in time */
  .route-times .missed { opacity: .32; }
  .route-times .sep { color: #5f5d57; }

  /* ------- footer stack: 12-hour outlook, bins, note */

  /* The footer stack hugs the bottom edge and the outlook keeps a constant
     height, so slack from a short departure list collects in one gap above
     it rather than stretching the rain bars into a mostly-empty box. */
  .foot { display: flex; flex-direction: column; gap: 24px; flex: 1;
          margin-top: 34px; justify-content: flex-end; }

  .fc { background: rgba(255,255,255,.035); padding: 24px 24px 20px;
        flex: none; display: flex; flex-direction: column; }
  .fc-head { display: flex; justify-content: space-between; align-items: baseline;
             margin-bottom: 16px; }
  .fc-head-l { display: flex; align-items: baseline; gap: 16px; }
  .fc-title { font-size: 30px; font-weight: 600; letter-spacing: 7px;
              text-transform: uppercase; color: #8d8a80; white-space: nowrap; }
  .fc-units { font-size: 26px; font-weight: 600; letter-spacing: 3px;
              text-transform: uppercase; color: #8d8a80; white-space: nowrap; }
  .fc-rain { font-size: 28px; font-weight: 600; letter-spacing: 4px;
             text-transform: uppercase; color: #6fb7e8; white-space: nowrap; }
  .fc-grid { display: grid; gap: 7px; height: 300px; }
  .fc-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .fc-tf, .fc-tc { font-family: 'IBM Plex Mono', monospace; font-size: 26px;
                   font-weight: 500; line-height: 1.15; }
  .fc-tf { color: #f5ece0; }
  .fc-tc { color: #e4f0ea; }
  .fc-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
  .fc-bar { width: 100%; background: #6fb7e8; }
  .fc-pop { font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: #6fb7e8; }
  .fc-hr { font-size: 26px; font-weight: 600; letter-spacing: 1px;
           text-transform: uppercase; color: #5f5d57; }

  .bins { display: flex; justify-content: space-between; align-items: center;
          border-top: 1px solid rgba(255,255,255,.12); padding-top: 20px; }
  .bins-line { font-size: 34px; font-weight: 700; letter-spacing: 3px;
               text-transform: uppercase; color: #d8d4cb; white-space: nowrap; }
  .bins-kind { font-size: 32px; font-weight: 600; letter-spacing: 3px;
               text-transform: uppercase; color: #5f5d57; white-space: nowrap; }

  .note { display: flex; gap: 18px; align-items: center; }
  .note-tag { font-family: 'IBM Plex Mono', monospace; font-size: 26px;
              font-weight: 600; letter-spacing: 2px; color: #f0b429;
              border: 2px solid #f0b429; padding: 6px 12px; white-space: nowrap; }
  /* agency alert text runs long; two lines is all the slot has */
  .note-text { font-size: 34px; font-weight: 500; letter-spacing: 1px;
               color: #a9a69d; line-height: 1.25; text-wrap: pretty;
               display: -webkit-box; -webkit-box-orient: vertical;
               -webkit-line-clamp: 2; overflow: hidden; }
  .note.stale .note-tag,
  .note.severe .note-tag { color: #d97b5a; border-color: #d97b5a; }
  .note.stale .note-text,
  .note.severe .note-text { color: #d97b5a; }

  /* -------------------------------------------------------- night state */

  #night {
    background: #050605; color: #4a473f;
    display: flex; flex-direction: column; justify-content: center;
    padding: 52px;
  }
  .n-clock { font-family: 'IBM Plex Mono', monospace; font-weight: 200;
             font-size: 330px; line-height: 1; letter-spacing: -14px; color: #6b675d; }
  .n-date { font-size: 52px; font-weight: 600; letter-spacing: 10px;
            text-transform: uppercase; margin-top: 16px; white-space: nowrap; }
  .n-rule { height: 2px; background: #1c1d1a; margin: 60px 0 44px; }
  .n-foot { display: flex; justify-content: space-between; align-items: baseline; }
  .n-foot span { font-size: 38px; font-weight: 600; letter-spacing: 5px;
                 text-transform: uppercase; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">

  <!-- ============================================================ day -->
  <section class="panel" id="day">
    <div class="head">
      <div>
        <div class="clock" id="clock">–:––</div>
        <div class="dateline" id="dateline"></div>
      </div>
      <div class="wx" id="wx">
        <div class="wx-temps">
          <span class="wx-f" id="wxF"></span>
          <span class="wx-slash">/</span>
          <span class="wx-c" id="wxC"></span>
        </div>
        <div class="wx-cond" id="wxCond"></div>
        <div class="wx-hilo" id="wxHiLo"></div>
      </div>
    </div>

    <div class="rule"></div>
    <div class="colhead"><span>Departures</span><span>Leave in</span></div>

    <div class="groups" id="groups"></div>

    <div class="foot" id="foot">
      <div class="fc" id="fc">
        <div class="fc-head">
          <div class="fc-head-l">
            <div class="fc-title" id="fcTitle">Next 12 hours</div>
            <div class="fc-units">°F / °C</div>
          </div>
          <div class="fc-rain">Rain chance</div>
        </div>
        <div class="fc-grid" id="fcGrid"></div>
      </div>

      <div class="bins" id="bins">
        <div class="bins-line" id="binsLine"></div>
        <div class="bins-kind" id="binsKind"></div>
      </div>

      <div class="note" id="note">
        <div class="note-tag" id="noteTag">NOTE</div>
        <div class="note-text" id="noteText"></div>
      </div>
    </div>
  </section>

  <!-- ========================================================== night -->
  <section class="panel" id="night" hidden>
    <div class="n-clock" id="nClock">–:––</div>
    <div class="n-date" id="nDate"></div>
    <div class="n-rule"></div>
    <div class="n-foot">
      <span id="nFirst"></span>
      <span id="nWx"></span>
    </div>
  </section>

</div>

<script>
"use strict";

// panel.html and panel_design.html differ only in this flag: the design
// copy falls back to demo data when no server is reachable.
const ALLOW_DEMO = false;

const W = 1080, H = 1920;
const ACCENTS = ["#8fd4c1", "#f0b429", "#6fb7e8", "#d99a9a"];
const ALERT_ROTATE_S = 8;   // seconds each alert holds the single note slot

let data = null;
let clockOffset = 0;        // serverNow - clientNow (s)
let tz = "America/Los_Angeles";
let lastGood = 0;           // client epoch (s) of the last successful fetch

// ---------------------------------------------------------------- time

function now() { return Date.now() / 1000 + clockOffset; }

// Intl formatters are expensive to construct and this page formats a few
// dozen timestamps every tick, so build each one once and reuse it. Keyed by
// locale + options + tz, so a timezone change from the server just makes new
// ones rather than needing the cache cleared.
const fmtCache = new Map();
function dtf(locale, opts) {
  const key = locale + "|" + tz + "|" + JSON.stringify(opts);
  let f = fmtCache.get(key);
  if (!f) {
    f = new Intl.DateTimeFormat(locale, Object.assign({ timeZone: tz }, opts));
    fmtCache.set(key, f);
  }
  return f;
}

function clockParts(epoch, opts) {
  return dtf("en-US", Object.assign({ hour12: true }, opts)).format(epoch * 1000);
}
// 7:34
function fmtTime(epoch) {
  return clockParts(epoch, { hour: "numeric", minute: "2-digit" })
      .replace(/\s*[AP]M$/i, "");
}
// 6:12a
function fmtTimeMer(epoch) {
  return clockParts(epoch, { hour: "numeric", minute: "2-digit" })
      .replace(/\s*AM$/i, "a").replace(/\s*PM$/i, "p");
}
// 3p
function fmtHour(epoch) {
  return clockParts(epoch, { hour: "numeric" })
      .replace(/\s*AM$/i, "a").replace(/\s*PM$/i, "p");
}
function fmtDateLine(epoch) {
  const ms = epoch * 1000;
  return dtf("en-US", { weekday: "long" }).format(ms)
       + " · "
       + dtf("en-US", { month: "short", day: "numeric" }).format(ms);
}
// minutes since local midnight, in the board's timezone
function localMinutes(epoch) {
  const s = dtf("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false })
      .format(epoch * 1000);
  const [h, m] = s.split(":").map(Number);
  return h * 60 + m;
}
function parseHM(s) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || "").trim());
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}

// ---------------------------------------------------------------- util

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function rgba(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
  if (!m) return `rgba(255,255,255,${a})`;
  const n = parseInt(m[1], 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
// Feed errors arrive as raw Python exception text. Nobody reads a stack
// trace from across the room, so say the one thing that's actionable.
function shortError(msg) {
  const m = String(msg || "");
  if (/\b401\b|valid token|unauthoriz/i.test(m)) return "feed needs an API token";
  if (/\b403\b|forbidden/i.test(m)) return "feed rejected the API token";
  if (/\b404\b/.test(m)) return "feed URL not found";
  if (/\b429\b|rate limit/i.test(m)) return "feed rate-limited";
  if (/\b5\d\d\b/.test(m)) return "feed server error";
  if (/timed out|timeout/i.test(m)) return "feed timed out";
  if (/not loaded yet/i.test(m)) return "loading schedule…";
  if (/ambiguous|candidates/i.test(m)) return "stop is ambiguous — see /";
  return m.length > 44 ? m.slice(0, 43) + "…" : m;
}
// render() runs once a second, but almost nothing on screen changes that
// often — the clock shows no seconds, times are absolute, and "leave in" is
// whole minutes. Every DOM write below is therefore made idempotent: build
// the value, compare it to what's already there, and only touch the document
// when it actually differs. A no-op tick then costs no style, layout or
// paint at all, which is the difference between smooth and sluggish on a
// low-power kiosk driving a 1080x1920 stage.
function setText(id, s) {
  const el = document.getElementById(id);
  if (el.textContent !== s) el.textContent = s;
}
function show(id, on) {
  const el = document.getElementById(id), want = !on;
  if (el.hidden !== want) el.hidden = want;
}
// innerHTML is the expensive one: it re-parses, re-styles and re-lays-out the
// whole subtree. Building the string is cheap by comparison, so build it every
// tick and let the comparison decide whether the DOM hears about it.
const lastHTML = new Map();
function setHTML(id, html) {
  if (lastHTML.get(id) === html) return;
  lastHTML.set(id, html);
  document.getElementById(id).innerHTML = html;
}
// Inline styles read back normalized ("#050605" -> "rgb(5, 6, 5)"), so
// compare against what we last wrote rather than against the element.
const lastStyle = new Map();
function setStyle(el, prop, value, key) {
  if (lastStyle.get(key) === value) return;
  lastStyle.set(key, value);
  el.style[prop] = value;
}

// ---------------------------------------------------------------- model

// Panel groups come from config.json; without them, fall back to the first
// few boards of the default tab, one group each.
function panelGroups() {
  const p = data.panel || {};
  if (p.groups && p.groups.length) return p.groups;
  return data.boards.filter(b => b.tab === data.default_tab).slice(0, 3)
      .map((b, i) => ({
        title: b.title,
        accent: b.route_color || ACCENTS[i % ACCENTS.length],
        boards: [{ board: b.title, label: b.title }],
      }));
}

// One group = one travel goal. Its hero number is the soonest departure
// across its boards that you can still walk to; each board contributes a
// row of upcoming times.
function groupModel(g, t) {
  const nTimes = (data.panel || {}).times_shown || 3;
  const rows = [];
  let best = null;

  for (const spec of g.boards || []) {
    const b = data.boards.find(x => x.title === spec.board);
    const label = spec.label || spec.board;
    if (!b) { rows.push({ label, html: "not configured", empty: true }); continue; }
    if (b.error) { rows.push({ label, html: esc(shortError(b.error)), empty: true }); continue; }

    const walk = b.walk_minutes;
    const deps = (b.departures || [])
        .filter(d => !d.cancelled && d.time > t - 30)
        .slice(0, nTimes);
    rows.push({
      label,
      // times you can't reach in time are dimmed rather than dropped — the
      // bus is still coming, you just aren't on it
      html: deps.length
        ? deps.map(d => `<span class="${(d.time - t) / 60 >= walk ? "" : "missed"}">${esc(fmtTime(d.time))}</span>`)
              .join('<span class="sep">  ·  </span>')
        : "no departures",
      empty: !deps.length,
    });

    const catchable = deps.find(d => (d.time - t) / 60 >= walk);
    if (catchable) {
      const leave = Math.max(0, Math.floor((catchable.time - t) / 60 - walk));
      if (!best || leave < best.leave) {
        best = { leave, via: spec.via || b.title, arrive: fmtTime(catchable.time) };
      }
    }
  }

  return {
    title: g.title,
    accent: g.accent || ACCENTS[0],
    via: best ? `${best.via} · ${best.arrive}` : "nothing catchable",
    leave: best ? String(best.leave) : "—",
    hasLeave: !!best,
    rows,
  };
}

// earliest upcoming departure across every board the panel shows
function firstBus(t) {
  let soonest = null;
  for (const g of panelGroups()) {
    for (const spec of g.boards || []) {
      const b = data.boards.find(x => x.title === spec.board);
      if (!b) continue;
      for (const d of b.departures || []) {
        if (d.cancelled || d.time <= t) continue;
        if (soonest === null || d.time < soonest) soonest = d.time;
      }
    }
  }
  return soonest;
}

// Live service alerts worth this screen's attention. The feeds carry the
// whole agency, and the server already narrowed them to boards we configured
// — narrow again to the boards this panel actually displays.
function panelAlerts() {
  const shown = new Set();
  for (const g of panelGroups())
    for (const spec of g.boards || []) shown.add(spec.board);
  return (data.alerts || [])
      .filter(a => (a.boards || []).some(b => shown.has(b)));
}

function binsModel(t) {
  const h = data.house || {};
  if (!h.trash_day) return null;
  const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday",
                "Friday", "Saturday"];
  const target = days.indexOf(h.trash_day);
  const today = days.indexOf(dtf("en-US", { weekday: "long" }).format(t * 1000));
  if (target < 0 || today < 0) return null;
  const until = (target - today + 7) % 7;
  const line = until === 0 ? `Bins out today — ${h.trash_day}`
             : until === 1 ? `Bins out tonight — ${h.trash_day} pickup`
             : `${h.trash_day} pickup · ${until} days`;
  return { line, kind: h.trash_kinds || "" };
}

// ---------------------------------------------------------------- render

function renderDay(t, wx) {
  setText("clock", fmtTime(t));
  setText("dateline", fmtDateLine(t));

  // --- weather header
  const hasWx = !!(wx && wx.temp_f !== null && wx.temp_f !== undefined);
  show("wx", hasWx);
  if (hasWx) {
    setText("wxF", wx.temp_f + "°F");
    setText("wxC", wx.temp_c + "°C");
    setText("wxCond", wx.cond || "");
    setText("wxHiLo", (wx.hi_f !== null && wx.lo_f !== null)
        ? `H ${wx.hi_f} · L ${wx.lo_f}` : "");
  }

  // --- departure groups
  setHTML("groups", panelGroups().map(g => {
    const m = groupModel(g, t);
    const rows = m.rows.map(r => `
      <div class="route-row">
        <div class="route-label">${esc(r.label)}</div>
        <div class="route-times${r.empty ? " empty" : ""}">${r.html}</div>
      </div>`).join("");
    return `
      <div class="group" style="--accent:${esc(m.accent)};--tint:${rgba(m.accent, .08)};--line:${rgba(m.accent, .21)}">
        <div class="group-head">
          <div>
            <div class="group-title">${esc(m.title)}</div>
            <div class="group-via">${esc(m.via)}</div>
          </div>
          <div class="group-leave">
            <div class="group-leave-label">Leave in</div>
            <div>
              <span class="group-leave-num${m.hasLeave ? "" : " none"}">${esc(m.leave)}</span>
              <span class="group-leave-unit">min</span>
            </div>
          </div>
        </div>
        ${rows}
      </div>`;
  }).join(""));

  // --- 12-hour outlook (only ever changes when the weather poll lands, but
  //     it is rebuilt here so the setHTML compare is the single gate)
  const hours = (wx && wx.hourly) || [];
  show("fc", hours.length > 0);
  if (hours.length) {
    setText("fcTitle", `Next ${hours.length} hours`);
    const grid = document.getElementById("fcGrid");
    setStyle(grid, "gridTemplateColumns", `repeat(${hours.length}, 1fr)`, "fcCols");
    setHTML("fcGrid", hours.map(h => `
      <div class="fc-col">
        <div class="fc-tf">${h.temp_f}°</div>
        <div class="fc-tc">${h.temp_c}°</div>
        <div class="fc-bar-wrap"><div class="fc-bar" style="height:${Math.round(8 + (h.pop / 100) * 92)}%"></div></div>
        <div class="fc-pop">${h.pop}%</div>
        <div class="fc-hr">${esc(fmtHour(h.time))}</div>
      </div>`).join(""));
  }

  // --- bins
  const bins = binsModel(t);
  show("bins", !!bins);
  if (bins) { setText("binsLine", bins.line); setText("binsKind", bins.kind); }

  // --- note slot, in priority order: a stale feed first (nothing else on
  //     screen can be trusted), then live service alerts, then the standing
  //     house note
  const stale = lastGood && (Date.now() / 1000 - lastGood) > 120;
  const alerts = panelAlerts();
  let tag = "NOTE", text = (data.house || {}).note || "", severe = false;
  if (stale) {
    tag = "STALE";
    text = "Live data unavailable — times below are the last ones received.";
  } else if (alerts.length) {
    // one slot, so several alerts take turns in it
    const i = Math.floor(t / ALERT_ROTATE_S) % alerts.length;
    const a = alerts[i];
    severe = a.rank >= 3;
    tag = (severe ? "ALERT" : "ADVISORY")
        + (alerts.length > 1 ? ` ${i + 1}/${alerts.length}` : "");
    text = a.text;
  }
  const noteEl = document.getElementById("note");
  noteEl.classList.toggle("stale", !!stale);
  noteEl.classList.toggle("severe", severe);
  show("note", !!text);
  setText("noteTag", tag);
  setText("noteText", text);
}

function renderNight(t, wx) {
  setText("nClock", fmtTime(t));
  setText("nDate", fmtDateLine(t));
  const fb = firstBus(t);
  setText("nFirst", fb ? `First bus ${fmtTimeMer(fb)}` : "No buses scheduled");
  const bits = [];
  if (wx && wx.temp_f !== null && wx.temp_f !== undefined) bits.push(wx.temp_f + "°");
  if (wx && wx.rain_pct !== null && wx.rain_pct !== undefined) bits.push(`Rain ${wx.rain_pct}%`);
  setText("nWx", bits.join(" · "));
}

function isNight(t) {
  const p = data.panel || {};
  if (p.night_start === null) return false;           // explicitly disabled
  const start = parseHM(p.night_start || "22:00");
  const end = parseHM(p.night_end || "06:00");
  if (start === null || end === null) return false;
  const m = localMinutes(t);
  return start < end ? (m >= start && m < end) : (m >= start || m < end);
}

function render() {
  if (!data || !data.boards) return;
  const t = now();
  const wx = data.weather;
  const night = isNight(t);

  show("day", !night);
  show("night", night);
  setStyle(document.body, "background", night ? "#050605" : "#0c0d0c", "bodyBg");
  if (night) renderNight(t, wx); else renderDay(t, wx);
}

// ---------------------------------------------------------------- fit

// The panel is authored portrait. On a landscape screen, rotate it here
// rather than at the display level: fit() already applies one composited
// transform, so folding a rotation into the same matrix is free, whereas
// rotating the display can fall back to a per-frame software rotate on a
// weak GPU (VC4 has no general 90° hardware rotate). Kiosk URL takes
// ?rotate=90 or ?rotate=270; without it nothing changes.
const ROTATE = (() => {
  const r = Number(new URLSearchParams(location.search).get("rotate"));
  return [90, 180, 270].includes(r) ? r : 0;
})();

function fit() {
  const quarter = ROTATE % 180 !== 0;   // 90/270 swap which axis bounds what
  const availW = quarter ? innerHeight : innerWidth;
  const availH = quarter ? innerWidth : innerHeight;
  const s = Math.min(availW / W, availH / H);
  document.getElementById("stage").style.transform =
      `translate(-50%, -50%) rotate(${ROTATE}deg) scale(${s})`;
}

// ---------------------------------------------------------------- data

async function refresh() {
  try {
    const r = await fetch("/api/board");
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
    clockOffset = data.now - Date.now() / 1000;
    tz = data.timezone;
    lastGood = Date.now() / 1000;
  } catch (e) {
    if (!data && ALLOW_DEMO) {      // design preview with no server behind it
      data = mockData();
      clockOffset = 0;
      tz = data.timezone;
    }
  }
  render();
}

                              headsign: hs || "", realtime: true, delay: 0,

      hourly: tempsF.map((tf, i) => ({
        time: t + (i + 1) * 3600, temp_f: tf,

    },
    house: { trash_day: "Wednesday", trash_kinds: "Compost + recycling",
             note: "Front-desk package pickup closes at 6." },

      { id: "a1", text: "52 detour at Shattuck — board at Oxford & Center",

        source: "actransit", boards: ["52 to campus"] },
    ],
    panel: {
      night_start: "22:00", night_end: "06:00", times_shown: 3,
      groups: [
        { title: "LBL", accent: "#8fd4c1",
          boards: [{ board: "Blue Uphill", label: "BLUE", via: "Blue Line" }] },
        { title: "Campus", accent: "#f0b429",
          boards: [{ board: "52 to campus", label: "52", via: "Bus 52" },
                   { board: "F Transbay", label: "F", via: "Bus F" }] },
      ],
    },
    boards: [
      { title: "Blue Uphill", tab: "work", source: "lbnl", stop: "Oxford At University",
        walk_minutes: 10, route_color: "#2F75B5", alerts: [], error: null,
        departures: [dep(16), dep(31), dep(46)] },
      { title: "52 to campus", tab: "work", source: "actransit",

      { title: "F Transbay", tab: "work", source: "actransit",

    ],
  };
}

addEventListener("resize", fit);
fit();
refresh();
setInterval(refresh, 15000);   // re-fetch from server
setInterval(render, 1000);     // tick countdowns locally
</script>
